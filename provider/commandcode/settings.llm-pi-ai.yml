# CommandCode provider route for the DSH llm-pi-ai adapter.
# Endpoint: https://api.commandcode.ai/provider/v1  (OpenAI Chat Completions)
# Requires the GOAT plan or higher: a Go plan key gets 403 upgrade_required.
#
# Image input is declared per model, measured 2026-09-17 against this endpoint:
# deepseek-v4.1-flash and deepseek-v4-flash both read a test PNG correctly,
# while deepseek-v4-pro replies "I can't read the image" - so it stays text-only.
# Declaring a capability the model lacks is what silently drops an attachment.
# __REF__ is replaced by scripts/Install-CommandCode.sh with the credential
# reference name; the key itself stays in the DSH credential store.
#
# ZDR (x-cmd-zdr: "1") is OFF by default on purpose, and enabling it is a real
# cost increase, not a free privacy toggle. Per Command Code's own ZDR page:
#
#   "Metered at the default allowance: ZDR requests use your plan's default
#    allowance, even if a model normally has a higher boosted allowance.
#    That means $20 on GOAT ... Higher per-request cost: Between default-allowance
#    metering and routing that can land on a pricier upstream, the same credits
#    buy fewer ZDR requests than regular ones."
#
# For deepseek-v4.1-flash on GOAT that is $60 of headroom without the flag vs
# $20 with it - a 3x cut - plus whatever the pricier ZDR upstream charges.
# Enable with the installer's --zdr only when the residency guarantee is worth it.
    commandcode:
      displayName: CommandCode
      apiKeyEnv: __REF__
      api: openai-completions
      baseURL: https://api.commandcode.ai/provider/v1
      #[zdr]headers:
      #[zdr]  x-cmd-zdr: "1"
      defaultContextWindow: 1000000
      defaultMaxTokens: 65536
      defaultInput:
        - text
      compat:
        supportsStore: false
        supportsDeveloperRole: false
        maxTokensField: max_tokens
        requiresReasoningContentOnAssistantMessages: true
        thinkingFormat: deepseek
      models:
        - id: deepseek/deepseek-v4.1-flash
          name: DeepSeek V4.1 Flash
          contextWindow: 1000000
          maxTokens: 65536
          input:
            - text
            - image
          reasoningEfforts:
            low: low
            medium: medium
            high: high
            max: max
        - id: deepseek/deepseek-v4-flash
          name: DeepSeek V4 Flash
          contextWindow: 1000000
          maxTokens: 65536
          input:
            - text
            - image
          reasoningEfforts:
            low: low
            medium: medium
            high: high
            max: max
        - id: deepseek/deepseek-v4-pro
          name: DeepSeek V4 Pro
          contextWindow: 1000000
          maxTokens: 65536
          input:
            - text
          reasoningEfforts:
            low: low
            medium: medium
            high: high
            max: max
