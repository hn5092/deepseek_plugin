# OpenCode Go: five parallel routes over one subscription, one credential
# reference per route so the whole set can be replayed after the app rewrites
# settings.yaml. __CLIENT__ is replaced by the installer (-Client) and keeps each
# route's x-opencode-session stable and distinct; it is not a secret.
llm-pi-ai:
  providers:
    opencode-go-1:
      displayName: "1"
      apiKeyEnv: OPENCODE_API_KEY_1
      api: openai-completions
      baseURL: https://opencode.ai/zen/go/v1
      headers:
        x-opencode-session: __CLIENT__-1
        user-agent: __CLIENT__-1/1.0
      defaultContextWindow: 1000000
      defaultMaxTokens: 65536
      defaultInput:
        - text
      compat:
        supportsStore: false
        supportsDeveloperRole: false
        maxTokensField: max_tokens
        requiresReasoningContentOnAssistantMessages: true
        thinkingFormat: deepseek
      models:
        - id: deepseek-v4.1-flash
          name: DeepSeek V4.1 Flash
          contextWindow: 1000000
          maxTokens: 65536
          input:
            - text
            - image
          reasoningEfforts:
            low: low
            high: high
            max: max
        - id: deepseek-v4.1-pro
          name: DeepSeek V4.1 Pro
          contextWindow: 1000000
          maxTokens: 65536
          input:
            - text
            - image
          reasoningEfforts:
            high: high
            max: max
