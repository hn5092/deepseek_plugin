# DSH CLI profile for the DeepSeek official provider.
# Credential reference only: put the key in $DSH_HOME/.credentials.yaml as
# DEEPSEEK_API_KEY (or set the environment variable of the same name).
- id: agent-default-model
  config:
    provider: deepseek-official
    model: deepseek-v4-flash

- id: llm-deepseek
  config:
    apiKeyEnv: DEEPSEEK_API_KEY
    baseURL: https://api.deepseek.com
    thinking: enabled
    reasoningEffort: high
    models:
      - id: deepseek-v4-flash
        name: DeepSeek-V4.1-Flash
        contextWindow: 1000000
        inputModalities:
          - text
          - image
      - id: deepseek-v4-pro
        name: DeepSeek-V4-Pro
        contextWindow: 1000000
      - id: deepseek-v4-flash-vision-exp
        name: DeepSeek-V4-Flash-Vision-Exp
        contextWindow: 1000000
        inputModalities:
          - text
          - image