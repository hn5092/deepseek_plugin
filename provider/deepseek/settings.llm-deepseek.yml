# DeepSeek official provider: model catalog for the llm-deepseek plugin.
# apiKeyEnv and baseURL come from the plugin defaults (DEEPSEEK_API_KEY,
# https://api.deepseek.com), so only the catalog is declared here.
llm-deepseek:
  models:
    - id: deepseek-v4-flash
      name: DeepSeek-V4.1-Flash
      description: Fast, efficient, and economical; suited to focused, routine, or
        parallel tasks.
      contextWindow: 1000000
      inputModalities:
        - text
        - image
    - id: deepseek-v4-pro
      name: DeepSeek-V4-Pro
      description: Stronger agentic coding, knowledge, and difficult reasoning; suited
        to complex or quality-critical tasks at higher cost.
      contextWindow: 1000000
      inputModalities:
        - text
    - id: deepseek-v4-flash-vision-exp
      name: DeepSeek-V4-Flash-Vision-Exp
      contextWindow: 1000000
      inputModalities:
        - text
        - image
      imagePixelBudget: 640000
      imageMaxBytes: 1048576